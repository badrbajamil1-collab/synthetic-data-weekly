# Core search terms tuned for enterprise & Well7 priorities. These are READ now:
# rank.prefilter_indices uses them as the cheap keyword gate before any model
# call, so an item must match at least one phrase to be worth scoring.
keywords:
  - "synthetic data"
  - "tabular data synthesis"
  - "differential privacy synthetic"
  - "synthetic time-series"
  - "privacy-preserving synthetic data"
  - "CTGAN"
  - "PrivBayes"
  - "synthetic document generation"
  - "data augmentation LLM"
  - "synthetic training data"
  - "synthetic dataset"
  - "data synthesizer"
  # Shorter phrases: a genuinely relevant item often omits the word
  # "synthetic" (DP-SGD, membership inference, tabular generation). Without
  # these the gate dropped Well7-relevant work while keeping noise.
  - "differential privacy"
  - "membership inference"
  - "privacy attack"
  - "tabular data"
  - "data synthesis"
  - "time series"
  - "federated learning"
  - "privacy preserving"
  - "anonymeter"
  - "dp-sgd"

# Data ingestion sources (Phase 1)
sources:
  arxiv:
    # No category filter: arXiv's `all:` search already spans cs.LG / cs.CR /
    # cs.AI / stat.ML, and adding cat: queries would multiply results by four.
    # A `categories` key used to sit here and was read by nobody.
    queries:
      - '"synthetic data"'
      - '"tabular synthesis"'
      - '"differential privacy" AND synthetic'
    max_results: 25
    retry_attempts: 3

  google_news:
    queries:
      - '"synthetic data" when:7d'
      - '"synthetic dataset" when:7d'
    hl: "en-US"
    gl: "US"
    ceid: "US:en"
    max_results: 20
    retry_attempts: 3

  reddit:
    subreddits:
      - "MachineLearning"
      - "LocalLLaMA"
      - "datascience"
    max_per_sub: 25
    retry_attempts: 4

  hacker_news:
    tags:
      - "synthetic data"
      - "tabular synthesis"
      - "synthetic dataset"
      - "data augmentation"
    max_results: 15
    retry_attempts: 3

  github:
    queries:
      - "synthetic-data"
      - "tabular-synthesis"
      - "differential-privacy"
      - "data-augmentation"
    max_results: 15
    retry_attempts: 3
    # A repo created before the week is only news when it published a release
    # inside it. Without this, `pushed:` made 2021 repos look brand new.
    include_releases: true

  # Research / vendor / industry blogs, read with feedparser
  blogs:
    max_per_feed: 15
    retry_attempts: 2
    feeds:
      - name: "OpenAI"
        url: "https://openai.com/news/rss.xml"
      - name: "Google DeepMind"
        url: "https://deepmind.google/blog/rss.xml"
      - name: "Google Research"
        url: "https://research.google/blog/rss/"
      - name: "Google AI (Keyword)"
        url: "https://blog.google/technology/ai/rss/"
      - name: "Hugging Face"
        url: "https://huggingface.co/blog/feed.xml"
      - name: "Microsoft Research"
        url: "https://www.microsoft.com/en-us/research/feed/"
      - name: "AWS Machine Learning"
        url: "https://aws.amazon.com/blogs/machine-learning/feed/"
      - name: "BAIR Berkeley"
        url: "https://bair.berkeley.edu/blog/feed.xml"
      - name: "The Gradient"
        url: "https://thegradient.pub/rss/"
      - name: "Together AI"
        url: "https://www.together.ai/blog/rss.xml"
      - name: "TechCrunch AI"
        url: "https://techcrunch.com/category/artificial-intelligence/feed/"
      - name: "KDnuggets"
        url: "https://www.kdnuggets.com/feed"
      - name: "Center for Data Innovation"
        url: "https://datainnovation.org/feed/"
