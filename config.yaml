schedule: "Saturday 08:00"  # read by schedule_task.py (Windows Task Scheduler)
lookback_days: 7
max_top_picks: 10

# Phase 2 — ranking. The model is scored 1-10 for relevance and 1-10 for Well7
# fit; `max_top_picks` above is the shortlist size, so there is only one owner
# of that number.
#
# The API key is NOT here. It lives in .env as OPENROUTER_API_KEY only.
ranking:
  model: "nvidia/nemotron-3-ultra-550b-a55b:free"
  base_url: "https://openrouter.ai/api/v1"
  # 15 items/call is verified: ~3k chars of input, ~660 completion tokens.
  # The startup guard aborts if batch_size * 45 + 200 exceeds max_tokens.
  batch_size: 15
  concurrency: 3
  # 2000 was verified for the old, short rubric. The sharpened rubric plus
  # structured JSON makes the prompt ~7k chars, and this model spends several
  # thousand tokens on hidden reasoning before emitting anything. At 2000 a
  # real 15-item batch returns empty content with finish_reason='length', so
  # every item comes back unscored and the whole week is thin. 8000 was probed
  # against a real batch and parsed all 15 rows.
  max_tokens: 8000
  reasoning_effort: "low"
  temperature: 0.0
  timeout_seconds: 180
  # 2, not 4: a 503 retry storm burns the day's 50 free-model requests before
  # summarising runs, and the report degenerates to extractive prose. Two
  # attempts cap the damage at ~2x the call count. A reshape of a retry is
  # semantic recovery anyway, and rank.py owns that layer.
  max_attempts: 2
  # Above this share of unscored items the run still writes output but warns.
  max_unscored_ratio: 0.10
  # fetch_candidates.py refuses to build a shortlist below this. Score floors
  # can legitimately leave a quiet week with only a few qualifying items, and
  # "fewer items is fine" now applies to the shortlist too.
  min_scored_to_proceed: 1
  # Title-token Jaccard at or above this is the same story (brief: "group items
  # with similar titles; keep the original source").
  duplicate_similarity: 0.80
  cache: true
  # Shortlist mix: at most this many GitHub repositories head the top 10, so
  # recently-pushed repos cannot crowd papers and news out on keyword fit
  # alone. The ranker still sees a repo's stars and creation date in the
  # prompt and discounts old low-star repos itself. 0 disables the cap.
  github_share_cap: 3
  # Cheap keyword gate before any model call. Obvious noise is scored 1 without
  # spending a free-tier request. `keywords` below is the vocabulary.
  prefilter: true
  # Batch scores are not comparable across calls. One final comparative call
  # re-scores the top N together so the shortlist has a single scale.
  editor_pass_size: 20

# Phase 3 — summarising. The model writes prose only; the section split is a
# rule in summarise.py. `picks` is the target number of top picks and must stay
# inside the format's 5-10 bound; tools and worth-a-look keep the format's 0-5
# caps. The API key is still only OPENROUTER_API_KEY in .env.
summarising:
  model: "nvidia/nemotron-3-ultra-550b-a55b:free"
  base_url: "https://openrouter.ai/api/v1"
  temperature: 0.2
  # 700 was too low: this model spends part of the budget on hidden reasoning
  # and then emits truncated JSON, which parses as nothing and forces the
  # extractive fallback. 2000 matches the ranking budget and was verified.
  max_tokens: 2000
  reasoning_effort: "low"
  timeout_seconds: 180
  max_attempts: 2
  concurrency: 3
  picks: 6
  max_tools: 5
  max_worth_a_look: 5
  # Minimum score for each section. Sections are never padded to a count: if
  # fewer items clear the floor, the section is shorter. verify_report.py
  # checks the floor instead of demanding five picks.
  min_score_top: 7
  min_score_tools: 6
  min_score_worth: 5
  # Characters of full text sent per item. The Microsoft item has ~21k; the
  # opening 6k is what a 2-3 sentence summary actually needs.
  max_text_chars: 6000

