# Curated report content for the week of 26 Oct – 1 Nov 2026.
# This is the Phase 3 artefact: ranking + summaries written only from the
# full text stored in candidates.json. Every URL below is re-checked before
# the report is rendered (see report_build.py).
#
# House style: top-pick summaries are 2 sentences (the spec allows 2-3 lines),
# one-liners everywhere else, and nothing is kept just to fill a section.

week_start: 2026-10-26
week_end: 2026-11-01

trend: |
  This week the field stopped asking whether synthetic data can be generated and started asking
  how to prove it is good enough. Clinical and behavioural studies put numbers on the
  synthetic-to-real gap: de-identification models trained on generated notes lose accuracy on
  real records, and deception detectors that scored above 90% on synthetic speech fell to
  roughly 35–45% on real recordings. Three arXiv papers this week circle the same question — how
  to order and verify a synthesiser — and none of them finds a free lunch. Adoption kept moving
  anyway: Rivian bought a synthetic-data startup for autonomy simulation, Microsoft
  described full synthetic enterprise environments for Copilot evaluation, and Tonic.ai took its
  platform into US public-sector procurement.

top_picks:
  - title: "Drift metrics predict how synthetic clinical text fails on real patient notes"
    url: "https://bioengineer.org/drift-metrics-predict-how-synthetic-clinical-text-fails-on-real-patient-notes/"
    source: "Bioengineer.org"
    published: 2026-10-29
    summary: >
      Notes generated by five small models, filtered by a judge model, were compared with real
      clinical corpora across 24 drift metrics. Jensen–Shannon divergence over unigrams and
      bigrams best predicted the F1 drop when a de-identification model moved to real notes
      (r ≈ 0.54), while surface style features predicted nothing.

  - title: "From synthetic enterprise data evaluations to real Microsoft Copilot AI confidence"
    url: "https://www.microsoft.com/en-us/research/blog/from-synthetic-enterprise-data-evaluations-to-real-microsoft-copilot-ai-confidence/"
    source: "Microsoft Research"
    published: 2026-10-30
    summary: >
      Microsoft builds full-scale synthetic enterprise environments from O*NET occupational data,
      job postings and SEC filings, then evaluates Copilot against them. The argument is that they
      reproduce real workflows and surface failures generic benchmarks miss, without touching
      customer data.

  - title: "Statistical Analysis of Synthetic Data with Verification: A Linear Regression Framework"
    url: "https://arxiv.org/abs/2610.40254"
    source: "arXiv (stat.ML)"
    published: 2026-10-29
    summary: >
      A theory paper on verified self-training, where a verifier filters generated samples by a
      threshold and the model retrains on the survivors. Tighter verification does not always
      lower risk, moderate generation noise can help, and full versus partial fine-tuning react
      differently to the same rule.

  - title: "A goodness of fit approach to select the optimal visit sequence for nonparametric data synthesis"
    url: "https://arxiv.org/abs/2610.38559"
    source: "arXiv (stat.ML)"
    published: 2026-10-28
    summary: >
      Sequential synthesis generates each variable conditional on the ones before it, so variable
      order changes output quality. Choosing that order by a goodness-of-fit criterion beats
      structure-based alternatives on quality and runtime, and applies to any data type and
      conditional model class.

  - title: "Sequential versus fully conditional specification for tree-based synthesis of health data"
    url: "https://arxiv.org/abs/2610.35163"
    source: "arXiv (stat.ML)"
    published: 2026-10-26
    summary: >
      Compares the two ways of combining tree-based conditional models into a synthetic
      distribution, sequential and fully conditional, on real medical data. Neither wins overall:
      sequential is sensitive to variable order, while fully conditional needs more
      hyperparameters and more compute.

  - title: "AI deception detectors stumble when synthetic training meets real-world stress"
    url: "https://bioengineer.org/ai-deception-detectors-stumble-when-synthetic-training-meets-real-world-stress/"
    source: "Bioengineer.org"
    published: 2026-10-29
    summary: >
      Four classical classifiers and a knowledge-grounded LLM were tested on synthetic interview
      data and on real recordings from a military mock-sabotage exercise. Classifiers above 90% on
      synthetic text fell to roughly 35–45% on spontaneous, stress-induced speech.

  - title: "Real Enough? Synthetic Users, Synthetic Data, and the Limits of Simulation"
    url: "https://microsoft.design/articles/synthetic-users/"
    source: "Microsoft Design"
    published: 2026-10-28
    summary: >
      Three Microsoft UX researchers argue over synthetic users and AI-moderated interviews: scale
      versus the reason researchers talk to people at all. A useful map of where simulation earns
      its place and where it substitutes confidence for evidence.

  - title: "Rivian buys synthetic data startup to boost its autonomy ambitions"
    url: "https://insideevs.com/news/813110/rivian-third-dimension-aquisition-autonomous-driving/"
    source: "InsideEVs"
    published: 2026-11-01
    summary: >
      Rivian acquired UK startup Third Dimension, which turns images and video into lifelike 3D
      environments, to build simulation for autonomous driving. The stated goal is training and
      validating on edge cases before they happen on the road.

tools:
  - name: "microsoft/DPSDA"
    url: "https://github.com/microsoft/DPSDA"
    note: >-
      Python library for differentially private synthetic data that needs no model training,
      using foundation-model APIs or simulators (Private Evolution); covers images, text and, in
      the newest paper, tabular data.

  - name: "opendp/tumult-analytics"
    url: "https://github.com/opendp/tumult-analytics"
    note: >-
      Python library for running differentially private queries over data at scale, now
      maintained under OpenDP after the Tumult Labs team joined LinkedIn.

  - name: "Synthetic Audience"
    url: "https://synthetic-audience.noniner.io"
    note: >-
      Builds a synthetic survey audience from US Census microdata and World Bank population
      structure, then reports a calibration score against real benchmarks instead of asking you
      to trust it.

  - name: "Genie 4"
    url: "https://deepmind.google/blog/genie-4-a-new-generation-of-world-simulation/"
    note: >-
      DeepMind's new world model, in research preview, generates interactive audio-capable
      simulations intended partly as training environments for robots and agents.

worth_a_look:
  - title: "AI-generated control arms in hematology trials: promise, challenges and clinical validity"
    url: "https://oncodaily.com/hematology/ai-in-hematology-trials-619289"
    note: >-
      Interview on synthetic control arms in oncology trials — where they help with rare
      populations, and why they cannot replace randomisation.

  - title: "Synthetic brain scans bridged between sites sharpen brain age prediction"
    url: "https://bioengineer.org/synthetic-brain-scans-bridged-between-sites-sharpen-brain-age-prediction/"
    note: >-
      Inter-Site SMOTE interpolates between age- and sex-matched participants scanned at
      different sites to counter scanner effects in MRI-based brain-age models.

  - title: "Synthetic child-adult interactions are not developmentally plausible"
    url: "https://arxiv.org/abs/2610.35029"
    note: >-
      Synthetic child-adult dialogue matches real speech on vocabulary but loses its fragmented,
      messy structure; fine-tuning on real dialogues closes part of the gap.

  - title: "Tonic.ai and Carahsoft partner to bring AI-native synthetic data to the public sector"
    url: "https://www.manilatimes.net/2026/10/28/tmt-newswire/globenewswire/tonicai-and-carahsoft-partner-to-bring-ai-native-synthetic-data-to-the-public-sector/2455352"
    note: >-
      Tonic.ai's synthetic data platform enters US public-sector procurement through Carahsoft's
      government contract vehicles.

  - title: "What training dataset transparency mandates hide"
    url: "https://techpolicy.press/what-training-dataset-transparency-mandates-hide"
    note: >-
      Argues that California's and the EU's dataset transparency rules disclose composition but
      not the processes that actually shape training data.
