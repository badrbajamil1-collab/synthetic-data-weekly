trend: >-
    This week's selection centers on differential privacy as a unifying layer for synthetic data
    generation. CoRTeC releases noisy count files that any generator can decode without additional
    privacy cost, while SAVANT integrates attention-based variational autoencoders with DP-SGD to
    explore how dataset size interacts with privacy budgets. A federated approach trains local diffusion
    models under differential privacy, and a modular algorithm library provides building blocks for such
    pipelines. Across these works, membership inference attacks serve as a common benchmark, with
    results showing attack success reduced to chance levels under formal guarantees, though utility
    costs vary by architecture and data modality.

