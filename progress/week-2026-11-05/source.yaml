  - title: "CoRTeC: A Differentially Private Release for Synthetic Tabular Data, Decodable by Any Generator"
    url: "https://arxiv.org/abs/2611.06342"
    source: "arXiv"
    published: 2026-11-04
    summary: >-
      CoRTeC releases differentially private synthetic tabular data by spending a privacy budget once on a
      file of noisy counts — group sizes, outcome balances, column histograms per outcome, and outcome
      rates in cells — that anyone can decode into synthetic rows at no privacy cost using a
      maximum-entropy decoder or language models that never see real records. At ε=2 on Adult the release
      trains classifiers within 0.02 AUC of a real sample; on NHANES and bank marketing it stays within
      0.05 AUC without the selection step. Controls show utility comes from the release and selection
      step, no private row reaches a model, no generated row copies a real one, and the strongest
      membership attack remains far below the budget bound.
