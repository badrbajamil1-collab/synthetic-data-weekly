    url: "https://github.com/dariemjnr/membership-inference-dp-gpt2"
    source: "GitHub"
    published: 2026-11-04
    summary: >-
      A GitHub notebook evaluates membership inference attacks on GPT-2 fine-tuned with LoRA on 1,200
      synthetic clinic records using DP-SGD at ε=8 and ε=1. Without differential privacy, a reference
      attack identifies 82% of training records at 1% false positive rate; DP reduces attack success to
      chance levels (~1% TPR) but increases validation perplexity from 5.65 to 15.59 (ε=8) and 73.72
      (ε=1). Training for only 5 epochs without DP yields lower perplexity (4.33) and reduced leakage (AUC
      0.602), suggesting early stopping mitigates risk. Results are limited by small model size, synthetic
      data, single seed, and loss-only attacks.
