[project]
name = "synthetic-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Badr Bajamil", email = "badrbajamil1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jupyterlab>=4.6.4",
    "pandas>=2.3.3",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "scikit-learn>=1.9.1",
    "sdv>=2.0.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
synthetic-data = "synthetic_data:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
