# The workflow the brief lists as a final-submission item (Option A).
# Scheduled runs deliver the real report to config.yaml's recipients once the
# SMTP_* secrets are set; with no credentials they fall back to --dry-run so a
# missing secret can never fail the weekly run. A manual "Run workflow" with
# send_email unchecked always forces a dry run.
#
# history.db / score_cache.json / summary_cache.json are NOT committable
# (git-ignored); they persist between runs through the cache step instead,
# so dedupe across weeks keeps working from Actions too.

name: Weekly synthetic data report

on:
  schedule:
    # Saturday 05:00 UTC = Saturday 08:00 UTC+3, matching config.yaml "Saturday 08:00"
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the email. Scheduled runs send once the SMTP_* secrets exist; leave unchecked to force a dry run."
        type: boolean
        default: false

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore history and score caches (dedupe + rerun cost)
        uses: actions/cache/restore@v4
        with:
          path: |
            history.db
            history.db.bak
            score_cache.json
            summary_cache.json
          key: weekly-cache-${{ github.run_id }}
          restore-keys: |
            weekly-cache-

      - name: Run the weekly pipeline
        env:
          # One documented secret feeds both accepted key names, so a repo
          # that only defines LLM_API_KEY cannot silently lose its key.
          OPENROUTER_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          # A real send needs all three SMTP credentials. Anything missing
          # falls back to --dry-run, which keeps the Saturday run green.
          ready=false
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            ready=true
          fi

          send=false
          if [ "$ready" = "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            send=true
          elif [ "$ready" = "true" ] && [ "${{ inputs.send_email }}" = "true" ]; then
            send=true
          fi

          if [ "$send" = "true" ]; then
            echo "mode: send"
            python main.py --pipeline
          else
            echo "mode: dry-run (SMTP secrets missing or send_email unchecked)"
            python main.py --pipeline --dry-run
          fi

      - name: Save history and score caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            history.db
            history.db.bak
            score_cache.json
            summary_cache.json
          # run_attempt keeps a re-run from colliding with its own earlier save.
          key: weekly-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the week's artefacts
        # A thin run exits 1 by design; the report it wrote is still the
        # deliverable, so the upload must not be skipped.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_number }}
          path: |
            email.eml
            progress/week-*/**
          if-no-files-found: error
          retention-days: 30
